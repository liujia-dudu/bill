<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>青禾小馆 · 提交核对（合成）</title>
  </head>
  <body>
    <h1>填写开票信息</h1>
    <p id="amount">¥ 268.00</p>
    <label>发票抬头 <input id="title" name="title" required /></label>
    <label>收票邮箱 <input id="email" name="email" type="email" required /></label>
    <div id="after"></div>
    <button type="button" id="submit">提交开票</button>
    <script>
      window.submitted = 0;
      const mode = new URLSearchParams(location.search).get('mode') || 'success';
      if (mode === 'agree')
        // Element Plus style: the real checkbox is hidden behind a styled span.
        document
          .querySelector('#after')
          .insertAdjacentHTML(
            'beforebegin',
            '<div class="user_agree"><label class="el-checkbox"><span class="el-checkbox__input">' +
              '<input type="checkbox" id="agree" style="position:absolute;width:0;height:0;opacity:0" />' +
              '<span class="el-checkbox__inner" style="display:inline-block;width:14px;height:14px;border:1px solid #999"></span>' +
              '</span></label> 我已阅读并同意<a href="#agreement">《用户授权协议》</a></div>' +
              '<label><input type="checkbox" id="marketing" /> 同意接收营销短信</label>',
          );
      // An error-like notice already on the page must not read as a rejected submit.
      if (mode === 'quiet' || mode === 'rejected')
        document
          .querySelector('#after')
          .insertAdjacentHTML('beforebegin', '<p>温馨提示：抬头填写有误将无法报销</p>');
      const send = () =>
        fetch('/submit-endpoint', { method: 'POST', body: '{}' }).then(() =>
          fetch('/submit-status').then((response) => response.json()),
        );
      const done = () =>
        send().then(() => {
          document.querySelector('#after').textContent = '开票申请已提交';
          document.querySelector('#submit').remove();
        });
      document.querySelector('#submit').onclick = () => {
        window.submitted++;
        if (mode === 'agree' && !document.querySelector('#agree').checked) {
          document.querySelector('#after').textContent = '请先阅读并同意用户授权协议';
          return;
        }
        if (mode === 'confirm') {
          if (confirm('确认提交这张发票？')) done();
        } else if (mode === 'fields') {
          document.querySelector('#after').innerHTML =
            '<label>补充电话 <input id="phone" name="phone" /></label>';
        } else if (mode === 'dialog') {
          const box = document.createElement('div');
          box.className = 'van-dialog';
          box.innerHTML =
            '<p>确认开票？</p><button type="button">取消</button><button type="button">确定</button>';
          box.querySelectorAll('button')[1].onclick = () => {
            box.remove();
            done();
          };
          document.body.append(box);
        } else if (mode === 'silent') {
          window.submitted = 0;
        } else if (mode === 'quiet') {
          // Sent, then nothing on the page changes.
          send();
        } else if (mode === 'rejected') {
          send().then(() => {
            document.querySelector('#after').textContent = '提交失败：邮箱格式不正确';
          });
        } else done();
      };
    </script>
  </body>
</html>
